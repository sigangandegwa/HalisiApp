# Halisi: Netlify Configuration (when Base Directory is configured as frontend/)

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# Next.js Runtime plugin for App Router, dynamic routes, and server-side features
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security & caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

